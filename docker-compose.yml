services:
  app:
    build: .
    # Image name that will also be used in CI/CD when pushing to Docker Hub
    image: ${DOCKERHUB_USERNAME:-mayank035}/lyrics-generator:latest
    container_name: lyrics-generator-app
    restart: unless-stopped
    ports:
      - "8502:8502"
    environment:
      # Set via .env file or use defaults
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017/lyrics}
      - VPS_HOST=${VPS_HOST:-167.71.235.91}
      - VPS_USER=${VPS_USER:-root}
      - VPS_PASSWORD=${VPS_PASSWORD:-password}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHERUSAGESTATS=false
    # Uncomment this in development if you want live-reload from local files
    # volumes:
    #   - .:/app
    networks:
      - lyrics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  lyrics-network:
    driver: bridge
